services:
  tropos:
    build:
      context: ./build-context
      dockerfile: Dockerfile
    network_mode: host
    command: ["python", "-m", "backend.server", "--host", "127.0.0.1", "--port", "8765", "--db", "/data/tropos.sqlite3"]
    env_file:
      - .env.production
    environment:
      TROPOS_MEITUAN_NODE_BIN: /usr/local/bin/node
      TROPOS_MEITUAN_SKILL_DIR: /opt/tropos-meituan/skill
      TROPOS_MEITUAN_PASSPORT_JS: /opt/tropos-meituan/runtime/package/dist/index.js
      TROPOS_MEITUAN_STATE_DIR: /opt/tropos-meituan/runtime/state
    volumes:
      - ./data:/data
      - ./meituan/skill:/opt/tropos-meituan/skill:ro
      - ./meituan/runtime/package:/opt/tropos-meituan/runtime/package:ro
      - ./meituan/runtime/state:/opt/tropos-meituan/runtime/state
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    security_opt:
      - no-new-privileges:true

  caddy:
    image: caddy:2-alpine
    network_mode: host
    env_file:
      - .env.production
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    restart: unless-stopped
    depends_on:
      tropos:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true

volumes:
  caddy_data:
  caddy_config:
