services:
  tropos:
    build:
      context: ./build-context
      dockerfile: Dockerfile
    network_mode: host
    command: ["python", "-m", "backend.server", "--host", "127.0.0.1", "--port", "8765", "--db", "/data/tropos.sqlite3"]
    volumes:
      - ./data:/data
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    security_opt:
      - no-new-privileges:true

  caddy:
    image: caddy:2-alpine
    network_mode: host
    env_file:
      - .env.production
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    restart: unless-stopped
    depends_on:
      tropos:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true

volumes:
  caddy_data:
  caddy_config:
